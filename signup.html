<!DOCTYPE html>
<html>
<head>
    <title>Signup</title>
</head>
<body>

    <h2>Signup</h2>

    <form action="/signup" method="POST">

        <input type="text" name="name" placeholder="Name" required><br><br>

        <input type="text" name="username" placeholder="Username" required><br><br>

        <input type="text" name="gender" placeholder="Gender" required><br><br>

        <input type="email" name="email" placeholder="Email" required><br><br>

        <input type="password" name="password" placeholder="Password" required><br><br>

        <input type="text" name="mobile" placeholder="Mobile" required><br><br>

        <input type="text" name="street" placeholder="Street" required><br><br>

        <input type="text" name="landmark" placeholder="Landmark" required><br><br>

        <input type="text" name="area" placeholder="Area" required><br><br>

        <input type="text" name="pincode" placeholder="Pincode" required><br><br>

        <button type="submit">Signup</button>

    </form>

    <a href="/login">Already have an account? Login</a>

</body>
</html>
